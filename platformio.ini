[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Default scheme has one ~1.3MB app partition and no room for a second -
; OTA needs two app slots (it flashes into whichever one ISN'T currently
; running, then swaps on success) so HTTPUpdate has nowhere to write
; without this. min_spiffs.csv gives ~1.9MB per app slot on this board's
; 4MB flash (shrinking the unused SPIFFS partition instead, since nothing
; in this project uses SPIFFS/LittleFS).
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI
    ESP32Encoder
    bblanchon/ArduinoJson

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; CGRAM_OFFSET is deliberately NOT set. It exists for ST7789 boards whose
    ; visible area is smaller than the controller's 240x320 GRAM (the common
    ; 240x240, 135x240 and 170x320 panels), and TFT_eSPI's fallback branch
    ; for anything else assumes 240x240: at rotation 2 it adds rowstart=80
    ; and at rotation 3 colstart=80. This panel really is 240x320, so those
    ; 80px are pure offset - left-handed mode (rotation 3) drew everything
    ; shifted a quarter of the way across the screen. At rotations 0 and 1
    ; the same code sets both offsets to 0, so removing the flag changes
    ; nothing in the normal orientation. Do not re-add it from an ST7789
    ; setup snippet.
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5                                                                                                                                                                                         
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=27
    -D ENCODER_A=32
    -D ENCODER_B=33
    -D ENCODER_BTN=25
    -D KO_BUTTON=26
    ; ST7789 panels run reliably at 40 MHz with normal wiring; at the old
    ; 10 MHz every fillRect/fillScreen/redraw took ~4x longer, so a
    ; half-drawn frame stayed on screen long enough to look like flicker
    ; and tearing. Drop this back to 27000000 (or 20000000) only if you see
    ; sparkle/wrong pixels on a board with long or loose dupont wiring.
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D TFT_RGB_ORDER=TFT_RGB
    ; USER_SETUP_LOADED=1 above means TFT_eSPI skips its own User_Setup.h
    ; and expects EVERYTHING - including which fonts get compiled in - to
    ; come from these build_flags. Without at least one LOAD_* flag, no
    ; font glyph data is compiled at all: fillRect/drawRect/drawBitmap
    ; (borders, QR code, loading bar) still work since they're raw pixel
    ; draws, but every print()/drawString() call silently draws nothing.
    ; The whole codebase only ever calls setTextFont(1) (or nothing, which
    ; defaults to font 1) and scales it with setTextSize() - nothing uses
    ; FONT2/4/6/7/8, GFXFF, or SMOOTH_FONT, so only GLCD is needed. Adding
    ; the rest bloats flash for fonts nothing references and can overflow
    ; the partition (1.31MB) - keep this to just LOAD_GLCD.
    -D LOAD_GLCD=1